# Hello: the fixture apple-ci's workflows are tested on. An iPhone, iPad and Mac app from one
# target, a local Swift package, and unit tests in the iOS Simulator, as the apps have.
name: Hello

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

# The owner's team, from the gitignored Signing.xcconfig (README.md, "Signing").
configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  HelloCore:
    path: Packages/HelloCore

targets:
  Hello:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hello
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # The build number script reads .git (README.md, "Build numbers").
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    dependencies:
      - package: HelloCore
    postBuildScripts:
      - name: Build number
        script: '"$SRCROOT/.apple-ci/build-number.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false

  HelloTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hello.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: HelloCore

schemes:
  Hello:
    build:
      targets:
        Hello: all
    test:
      targets:
        - HelloTests
