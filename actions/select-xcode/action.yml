name: Select Xcode
description: >-
  Selects an installed Xcode by version ("26.6", "26", or "default" for the runner's own choice)
  and prints it with its Swift. When none matches, it fails and lists the installed ones.
inputs:
  version:
    description: An Xcode version or its prefix ("26.6", "26"), or "default".
    default: default
  if-missing:
    description: >-
      "fail" (the default) or "skip": with "skip", a version the runner doesn't have is a warning,
      and the `available` output is false.
    default: fail
outputs:
  available:
    description: Whether the version was found and selected ("true" or "false").
    value: ${{ steps.select.outputs.available }}
  path:
    description: The selected Xcode's path.
    value: ${{ steps.select.outputs.path }}
  version:
    description: The selected Xcode's version.
    value: ${{ steps.select.outputs.version }}
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        WANTED: ${{ inputs.version }}
        IF_MISSING: ${{ inputs.if-missing }}
      run: |
        if [ "$IF_MISSING" = skip ]; then
          python3 "${{ github.action_path }}/select_xcode.py" "$WANTED" --allow-missing
        else
          python3 "${{ github.action_path }}/select_xcode.py" "$WANTED"
        fi
