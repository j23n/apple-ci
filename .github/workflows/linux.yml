# The Linux half of an app's CI: a pinned Swift toolchain, then one command, usually
# `make ci-linux` (README.md, "The build contract").
# It runs once per commit: on pushes, not again on the pull request (README.md, "When CI runs").
#
#   jobs:
#     linux:
#       uses: j23n/apple-ci/.github/workflows/linux.yml@main
#
# Swift is swift.org's toolchain for Ubuntu 24.04, checked against its signature and cached per
# version, installed on the runner itself. No container: Docker Hub's pull limit, then Amazon ECR
# Public's data limit, failed these jobs before any step ran.
name: Linux

on:
  workflow_call:
    inputs:
      name:
        description: The job's name.
        type: string
        default: Linux
      swift:
        description: The Swift version, a swift.org release such as 6.3 or 6.3.1.
        type: string
        default: "6.3"
      run:
        description: The command to run.
        type: string
        default: make ci-linux
      working-directory:
        description: Where to run it.
        type: string
        default: .
      apt-packages:
        description: More Ubuntu packages to install (make, git and curl always are).
        type: string
        default: ""
      uv:
        description: Install uv, for Python tools.
        type: boolean
        default: false
      lfs:
        description: Check out Git LFS files.
        type: boolean
        default: false
      cache-path:
        description: A path to cache between runs, such as downloaded reference data.
        type: string
        default: ""
      cache-key:
        description: The cache's key; change it to refresh the cache.
        type: string
        default: ""
      cache-hash-files:
        description: Files whose hash ends the cache's key, so a change to them refreshes it.
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 30

jobs:
  linux:
    name: ${{ inputs.name }}
    # Runs on pushes, manual runs and pull requests from forks. A pull request from a branch of the
    # app's repository skips it, starting no runner: the push to that branch ran it on the same commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # The toolchain's URL names the Ubuntu version, so the runner's is pinned.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Tools
        env:
          PACKAGES: ${{ inputs.apt-packages }}
          LFS: ${{ inputs.lfs }}
        run: |
          extra="$PACKAGES"
          [ "$LFS" = true ] && extra="$extra git-lfs"
          sudo apt-get update -qq
          # make, git and curl, then what swift.org lists for the toolchain on Ubuntu 24.04.
          # shellcheck disable=SC2086
          sudo apt-get install -y -qq --no-install-recommends make git curl ca-certificates gnupg2 \
            binutils libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev \
            libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata \
            unzip zlib1g-dev $extra
      - name: Swift toolchain cache
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: ~/swift-toolchain
          key: swift-${{ inputs.swift }}-ubuntu24.04-${{ runner.arch }}
      - name: Swift
        env:
          SWIFT_VERSION: ${{ inputs.swift }}
          CACHED: ${{ steps.swift-cache.outputs.cache-hit }}
        run: |
          dir="$HOME/swift-toolchain"
          if [ "$CACHED" != true ]; then
            name="swift-$SWIFT_VERSION-RELEASE"
            url="https://download.swift.org/swift-$SWIFT_VERSION-release/ubuntu2404/$name/$name-ubuntu24.04.tar.gz"
            cd "$RUNNER_TEMP"
            curl -fsSL --retry 3 -o swift.tar.gz "$url"
            curl -fsSL --retry 3 -o swift.tar.gz.sig "$url.sig"
            curl -fsSL --retry 3 https://www.swift.org/keys/all-keys.asc | gpg --batch --quiet --import -
            gpg --batch --verify swift.tar.gz.sig swift.tar.gz
            mkdir -p "$dir"
            tar -xzf swift.tar.gz -C "$dir" --strip-components=1
            rm swift.tar.gz swift.tar.gz.sig
          fi
          echo "$dir/usr/bin" >> "$GITHUB_PATH"
          "$dir/usr/bin/swift" --version
      - uses: actions/checkout@v5
        with:
          lfs: ${{ inputs.lfs }}
      - name: uv
        if: inputs.uv
        uses: astral-sh/setup-uv@v6
      - name: Cache
        if: inputs.cache-path != ''
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}-${{ inputs.cache-hash-files != '' && hashFiles(inputs.cache-hash-files) || 'none' }}
      - name: Is the app's apple.mk current?
        working-directory: ${{ inputs.working-directory }}
        run: |
          [ -f .apple-ci/apple.mk ] || exit 0
          if ! curl -fsSL https://raw.githubusercontent.com/j23n/apple-ci/main/make/apple.mk | diff -q - .apple-ci/apple.mk >/dev/null; then
            echo "::warning::.apple-ci/apple.mk differs from j23n/apple-ci's make/apple.mk: run make update-apple-ci"
          fi
      - name: Are the app's shared Claude instructions current?
        working-directory: ${{ inputs.working-directory }}
        run: |
          [ -d .apple-ci/claude ] || exit 0
          curl -fsSL https://raw.githubusercontent.com/j23n/apple-ci/main/claude/update.sh | sh -s -- --check ||
            echo "::warning::.apple-ci/claude differs from j23n/apple-ci's claude/: run make update-apple-ci"
      - name: ${{ inputs.run }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.run }}
