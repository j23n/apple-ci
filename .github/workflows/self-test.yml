# apple-ci tests itself: the shared workflows run on the fixture (an iPhone, iPad and Mac app with
# a package), and the Xcode selector picks a version and refuses one the runner doesn't have.
name: Self-test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
    with:
      name: Linux · fixture
      working-directory: fixture

  macos:
    uses: ./.github/workflows/macos.yml
    with:
      name: macOS · fixture
      working-directory: fixture

  xcode-selector:
    name: Xcode selector
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: A version prefix picks the newest match
        id: newest
        uses: ./actions/select-xcode
        with:
          version: "26"
      - name: Check it
        env:
          VERSION: ${{ steps.newest.outputs.version }}
        run: |
          echo "Selected $VERSION"
          case "$VERSION" in 26.*) ;; *) echo "expected a 26.x"; exit 1 ;; esac
      - name: A missing version fails
        run: |
          if python3 actions/select-xcode/select_xcode.py 99; then echo "Xcode 99 shouldn't exist"; exit 1; fi
      - name: A missing version can be skipped
        id: skipped
        uses: ./actions/select-xcode
        with:
          version: "99"
          if-missing: skip
      - name: Check it
        env:
          AVAILABLE: ${{ steps.skipped.outputs.available }}
        run: test "$AVAILABLE" = false

  skipped-job:
    uses: ./.github/workflows/macos.yml
    with:
      name: macOS · a missing Xcode skips
      working-directory: fixture
      xcode: "99"
      xcode-missing: skip
      run: exit 1

  apple-mk:
    name: Fixture's apple.mk is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: diff -u make/apple.mk fixture/.apple-ci/apple.mk

  default-goal:
    name: make alone runs the app's first rule (${{ matrix.os }})
    strategy:
      matrix:
        # macOS's make is GNU Make 3.81, the oldest the rules support.
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: make --version | head -1
      - name: The fixture's help, not apple.mk's project
        run: |
          make -s -C fixture > "$RUNNER_TEMP/default-goal.txt"
          head -1 "$RUNNER_TEMP/default-goal.txt" | grep '^make test'

  test-failures:
    name: make test-app says why a test failed
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: A failing test's message is in the output
        working-directory: fixture
        run: |
          if TEST_RUNNER_HELLO_FAIL=1 make test-app > "$RUNNER_TEMP/test-app.txt" 2>&1; then
            echo "the test should have failed"; exit 1
          fi
          tail -40 "$RUNNER_TEMP/test-app.txt"
          grep -q "failed on purpose for apple-ci's self-test" "$RUNNER_TEMP/test-app.txt"
