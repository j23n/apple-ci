# apple-ci tests itself: the shared workflows run on the fixture (an iPhone, iPad and Mac app with
# a package), and the Xcode selector picks a version and refuses one the runner doesn't have.
name: Self-test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
    with:
      name: Linux · fixture
      working-directory: fixture

  macos:
    uses: ./.github/workflows/macos.yml
    with:
      name: macOS · fixture
      working-directory: fixture

  xcode-selector:
    name: Xcode selector
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: A version prefix picks the newest match
        id: newest
        uses: ./actions/select-xcode
        with:
          version: "26"
      - name: Check it
        env:
          VERSION: ${{ steps.newest.outputs.version }}
        run: |
          echo "Selected $VERSION"
          case "$VERSION" in 26.*) ;; *) echo "expected a 26.x"; exit 1 ;; esac
      - name: A missing version fails
        run: |
          if python3 actions/select-xcode/select_xcode.py 99; then echo "Xcode 99 shouldn't exist"; exit 1; fi
      - name: A missing version can be skipped
        id: skipped
        uses: ./actions/select-xcode
        with:
          version: "99"
          if-missing: skip
      - name: Check it
        env:
          AVAILABLE: ${{ steps.skipped.outputs.available }}
        run: test "$AVAILABLE" = false

  skipped-job:
    uses: ./.github/workflows/macos.yml
    with:
      name: macOS · a missing Xcode skips
      working-directory: fixture
      xcode: "99"
      xcode-missing: skip
      run: exit 1

  claude:
    name: Shared Claude instructions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: update.sh copies them, and --check notices a changed copy
        run: |
          repo="$PWD"
          export APPLE_CI_RAW="file://$repo"
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          # A copy of a file that's no longer shared goes.
          mkdir -p .apple-ci/claude && touch .apple-ci/claude/link-pr.sh
          sh "$repo/claude/update.sh" apps
          test ! -e .apple-ci/claude/link-pr.sh
          for file in j23n.md apps.md; do cmp "$repo/claude/$file" ".apple-ci/claude/$file"; done
          cmp "$repo/claude/pull_request_template.md" .github/pull_request_template.md
          sh "$repo/claude/update.sh" --check
          echo "An edit" >> .apple-ci/claude/apps.md
          if sh "$repo/claude/update.sh" --check; then echo "--check missed the edit"; exit 1; fi

  apple-mk:
    name: Fixture's apple.mk is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          diff -u make/apple.mk fixture/.apple-ci/apple.mk
          diff -u make/build-number.sh fixture/.apple-ci/build-number.sh

  signing:
    name: make signing writes the team and keeps the rest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixture
    steps:
      - uses: actions/checkout@v5
      - name: Without a team it says how
        run: |
          if make signing 2>&1; then echo "make signing ran without a team"; exit 1; fi
      - name: It writes the team, replaces it, and keeps other settings
        run: |
          make signing TEAM=AAAA111111
          echo "OTHER_SETTING = 1" >> Signing.xcconfig
          make signing TEAM=BBBB222222
          cat Signing.xcconfig
          test "$(grep -c '^DEVELOPMENT_TEAM' Signing.xcconfig)" = 1
          grep -qx 'DEVELOPMENT_TEAM = BBBB222222' Signing.xcconfig
          grep -qx 'OTHER_SETTING = 1' Signing.xcconfig
      - name: J23N_TEAM is the default team
        run: |
          rm Signing.xcconfig
          J23N_TEAM=CCCC333333 make signing
          grep -qx 'DEVELOPMENT_TEAM = CCCC333333' Signing.xcconfig
      - name: An agent's session can't write it
        run: |
          if CLAUDECODE=1 make signing TEAM=DDDD444444; then echo "make signing ran in an agent's session"; exit 1; fi
          grep -qx 'DEVELOPMENT_TEAM = CCCC333333' Signing.xcconfig

  build-number:
    name: The build number is the number of commits
    runs-on: macos-26
    defaults:
      run:
        working-directory: fixture
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build the fixture
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          make build
      - name: Each product's CFBundleVersion is git rev-list --count HEAD
        run: |
          expected=$(make -s build-number)
          for plist in .build/DerivedData/Build/Products/Debug-iphonesimulator/Hello.app/Info.plist \
                       .build/DerivedData/Build/Products/Debug/Hello.app/Contents/Info.plist; do
            actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
            echo "$plist: $actual (expected $expected)"
            test "$actual" = "$expected"
          done

  default-goal:
    name: make alone runs the app's first rule (${{ matrix.os }})
    strategy:
      matrix:
        # macOS's make is GNU Make 3.81, the oldest the rules support.
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: make --version | head -1
      - name: The fixture's help, not apple.mk's project
        run: |
          make -s -C fixture > "$RUNNER_TEMP/default-goal.txt"
          head -1 "$RUNNER_TEMP/default-goal.txt" | grep '^make test'

  test-failures:
    name: make test-app says why a test failed
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: A failing test's message is in the output
        working-directory: fixture
        run: |
          if TEST_RUNNER_HELLO_FAIL=1 make test-app > "$RUNNER_TEMP/test-app.txt" 2>&1; then
            echo "the test should have failed"; exit 1
          fi
          tail -40 "$RUNNER_TEMP/test-app.txt"
          grep -q "failed on purpose for apple-ci's self-test" "$RUNNER_TEMP/test-app.txt"
