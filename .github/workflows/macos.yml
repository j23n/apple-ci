# The macOS half of an app's CI: an Xcode, XcodeGen, then one command, usually `make ci-macos`
# (README.md, "The build contract"). Call it once more for slower jobs such as UI tests and
# screenshots, with their own command and an artifact to keep.
#
#   jobs:
#     macos:
#       uses: j23n/apple-ci/.github/workflows/macos.yml@main
#
# Builds are unsigned (CODE_SIGNING_ALLOWED=NO) or signed to run locally: the Makefile decides.
# It runs on pushes to the default branch, manual runs, and a pull request when it's given the
# `ci:mac` label, which the review agent adds when it judges the Mac's build is needed (README.md,
# "When CI runs"). The app's ci.yml lists `labeled` among its pull_request types.
name: macOS

on:
  workflow_call:
    inputs:
      name:
        description: The job's name.
        type: string
        default: macOS
      runner:
        description: The GitHub-hosted macOS image.
        type: string
        default: macos-26
      xcode:
        description: >-
          An Xcode version or its prefix ("26.6", "26"), or "default" for the runner's own. The
          job fails, listing what's installed, when the runner doesn't have it.
        type: string
        default: default
      xcode-missing:
        description: >-
          What to do when the runner doesn't have that Xcode: "fail", or "skip", which passes
          with a warning without running anything, for an app that needs an Xcode the hosted
          runners don't have yet. It runs again by itself once they do.
        type: string
        default: fail
      run:
        description: The command to run.
        type: string
        default: make ci-macos
      working-directory:
        description: Where to run it.
        type: string
        default: .
      brew:
        description: Homebrew formulae to install.
        type: string
        default: xcodegen
      uv:
        description: Install uv, for Python tools.
        type: boolean
        default: false
      lfs:
        description: Check out Git LFS files.
        type: boolean
        default: false
      ui-automation:
        description: Let UI tests drive the Mac without asking.
        type: boolean
        default: false
      artifact-name:
        description: Upload `artifact-path` under this name, whether the command passed or not.
        type: string
        default: ""
      artifact-path:
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 60
      pull-request-label:
        description: The label that runs the job on a pull request, when it's added.
        type: string
        default: "ci:mac"

jobs:
  macos:
    name: ${{ inputs.name }}
    # Runs on pushes to the default branch, on manual (and other) runs, and on a pull request when
    # `pull-request-label` is added to it. Other pushes and pull request events skip it, starting no
    # runner: on a pull request, the review agent adds the label once the Mac's build is worth it.
    if: >-
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
        github.event.label.name == inputs.pull-request-label) ||
      (github.event_name != 'push' && github.event_name != 'pull_request')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: ${{ inputs.lfs }}
      - name: Xcode
        id: xcode
        uses: j23n/apple-ci/actions/select-xcode@main
        with:
          version: ${{ inputs.xcode }}
          if-missing: ${{ inputs.xcode-missing }}
      - name: Skipped
        if: steps.xcode.outputs.available != 'true'
        env:
          WANTED: ${{ inputs.xcode }}
        run: |
          echo "### Skipped: this runner doesn't have Xcode $WANTED" >> "$GITHUB_STEP_SUMMARY"
          echo "The job runs again by itself once the hosted runners have it." >> "$GITHUB_STEP_SUMMARY"
      - name: Tools
        if: steps.xcode.outputs.available == 'true' && inputs.brew != ''
        env:
          FORMULAE: ${{ inputs.brew }}
        # shellcheck disable=SC2086
        run: brew install $FORMULAE
      - name: uv
        if: steps.xcode.outputs.available == 'true' && inputs.uv
        uses: astral-sh/setup-uv@v6
      - name: Let UI tests drive the Mac
        if: steps.xcode.outputs.available == 'true' && inputs.ui-automation
        run: sudo automationmodetool enable-automationmode-without-authentication || true
      - name: ${{ inputs.run }}
        if: steps.xcode.outputs.available == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.run }}
      - name: Keep ${{ inputs.artifact-name }}
        if: (success() || failure()) && steps.xcode.outputs.available == 'true' && inputs.artifact-name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: warn
